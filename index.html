        /* Sobre animado en la pantalla de apertura (imágenes reales) */
        .envelope {
            width: 220px;
            max-width: 70vw;
            position: relative;
            cursor: pointer;
            transition: transform .25s ease;
        }
        .envelope:hover { transform: scale(1.05); }
        .envelope:active { transform: scale(.96); }
        .envelope img.envelope-img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 10px 24px rgba(0,0,0,.35));
        }
        .envelope .seal {
            position: absolute;
            top: 50%; left: 50%;
            width: 34%;
            transform: translate(-50%, -50%);
            transition: transform .5s ease, opacity .5s ease;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,.3));
        }
        .envelope.open .seal {
            transform: translate(-50%, -180%) rotate(-25deg);
            opacity: 0;
        }

        /* Brillos mágicos cayendo sobre la pantalla de apertura */
        .sparkle-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }
        .sparkle {
            position: absolute;
            top: -8%;
            opacity: 0;
            animation-name: sparkle-drift, sparkle-twinkle;
            animation-timing-function: linear, ease-in-out;
            animation-iteration-count: infinite, infinite;
            will-change: transform, opacity;
        }
        .sparkle.star {
            color: #FFF7EE;
            text-shadow:
                0 0 4px #FFF3E0,
                0 0 10px #F3C6D0,
                0 0 18px #BE797F;
        }
        .sparkle.dust {
            border-radius: 50%;
            background: radial-gradient(circle, #FFF9F2 0%, #F6CBD6 45%, rgba(190,121,127,0) 75%);
            box-shadow: 0 0 8px 2px rgba(255, 235, 240, 0.6);
        }
        @keyframes sparkle-drift {
            0%   { transform: translate(0, 0) rotate(0deg); }
            25%  { transform: translate(18px, 25vh) rotate(90deg); }
            50%  { transform: translate(-14px, 50vh) rotate(180deg); }
            75%  { transform: translate(16px, 75vh) rotate(270deg); }
            100% { transform: translate(0, 108vh) rotate(360deg); }
        }
        @keyframes sparkle-twinkle {
            0%   { opacity: 0; transform: scale(.4); }
            8%   { opacity: 1; transform: scale(1); }
            50%  { opacity: .55; transform: scale(.85); }
            92%  { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(.4); }
        }

        /* Reproductor de música: 10% más pequeño y 7%-5% más abajo (neto: sube) */
        .music-player {
            transform: scale(0.9) translateY(calc(-14rem + 2vh));
        }
        @media (min-width: 640px) {
            .music-player {
                transform: scale(0.9) translateY(calc(-18rem + 2vh));
            }
        }

        /* Botón de ubicación de recepción: 5% más abajo */
        .reception-btn {
            transform: translateY(calc(2.5rem + 5vh));
        }
        @media (min-width: 640px) {
            .reception-btn {
                transform: translateY(calc(3rem + 5vh));
            }
        }

        /* Contador regresivo: 9%+5% más pequeño y 5%-2% más abajo (neto: sube) */
        .countdown-block {
            transform: scale(0.8645) translateY(calc(-9rem + 3vh));
        }
        @media (min-width: 640px) {
            .countdown-block {
                transform: scale(0.8645) translateY(calc(-11rem + 3vh));

            <!-- Contador Regresivo Estilo Rosa (#BF7D83) Sin Sombra Negra y Letra Menos Gruesa -->
            <div class="my-auto flex flex-col items-center gap-4 text-center w-full px-4 countdown-block">
                <div class="flex items-start justify-center gap-2 sm:gap-4 text-white">
                    
                    <!-- Días -->
                    <div class="flex flex-col items-center gap-1.5 sm:gap-2">
                        <div class="flex items-center justify-center w-16 h-16 sm:w-20 sm:h-20 rounded-full border-2 border-[#BF7D83] bg-transparent shadow-[0_0_15px_rgba(191,125,131,0.4)]">
                            <span id="cd-days" class="text-2xl sm:text-3xl font-bold text-[#BF7D83] leading-none">00</span>
                        </div>
                        <span class="text-[10px] sm:text-xs uppercase text-[#BF7D83] tracking-widest font-semibold">Días</span>
                    </div>

                    <span class="text-xl sm:text-2xl text-[#BF7D83] font-medium mt-5 sm:mt-6">:</span>

                    <!-- Horas -->
                    <div class="flex flex-col items-center gap-1.5 sm:gap-2">
                        <div class="flex items-center justify-center w-16 h-16 sm:w-20 sm:h-20 rounded-full border-2 border-[#BF7D83] bg-transparent shadow-[0_0_15px_rgba(191,125,131,0.4)]">
                            <span id="cd-hours" class="text-2xl sm:text-3xl font-bold text-[#BF7D83] leading-none">00</span>
                        </div>
                        <span class="text-[10px] sm:text-xs uppercase text-[#BF7D83] tracking-widest font-semibold">Horas</span>
                    </div>

                    <span class="text-xl sm:text-2xl text-[#BF7D83] font-medium mt-5 sm:mt-6">:</span>

                    <!-- Minutos -->
                    <div class="flex flex-col items-center gap-1.5 sm:gap-2">
                        <div class="flex items-center justify-center w-16 h-16 sm:w-20 sm:h-20 rounded-full border-2 border-[#BF7D83] bg-transparent shadow-[0_0_15px_rgba(191,125,131,0.4)]">
                            <span id="cd-minutes" class="text-2xl sm:text-3xl font-bold text-[#BF7D83] leading-none">00</span>
                        </div>
                        <span class="text-[10px] sm:text-xs uppercase text-[#BF7D83] tracking-widest font-semibold">Min</span>
                    </div>

                    <span class="text-xl sm:text-2xl text-[#BF7D83] font-medium mt-5 sm:mt-6">:</span>

                    <!-- Segundos -->
                    <div class="flex flex-col items-center gap-1.5 sm:gap-2">
                        <div class="flex items-center justify-center w-16 h-16 sm:w-20 sm:h-20 rounded-full border-2 border-[#BF7D83] bg-transparent shadow-[0_0_15px_rgba(191,125,131,0.4)]">
                            <span id="cd-seconds" class="text-2xl sm:text-3xl font-bold text-[#BF7D83] leading-none">00</span>
                        </div>
                        <span class="text-[10px] sm:text-xs uppercase text-[#BF7D83] tracking-widest font-semibold">Seg</span>
                    </div>
                </div>
            </div>

            <button onclick="goToPage(1)" class="text-white/70 hover:text-white transition-colors duration-300 text-xs flex flex-col items-center gap-1" aria-label="Volver al inicio">
                <i class="fas fa-arrow-up text-lg drop-shadow-lg"></i>
                <span class="drop-shadow">Inicio</span>
            </button>
        </section>
    </main>

    <script>
        function goToPage(pageNum) {
            const el = document.getElementById(`pagina-${pageNum}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth' });
            }
        }

        const audio = document.getElementById('bg-music');
        const playIcon = document.getElementById('play-icon');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        let isPlaying = false;

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updateUI(playing) {
            isPlaying = playing;
            if (playIcon) {
                if (playing) {
                    playIcon.className = 'fas fa-pause text-xl text-white';
                } else {
                    playIcon.className = 'fas fa-play text-xl text-white ml-0.5';
                }
            }
        }

        function playMusic() {
            audio.play().then(() => {
                updateUI(true);
            }).catch(err => {
                console.log("Autoplay prevent response:", err);
                updateUI(false);
            });
        }

        function playMusicMuted() {
            audio.muted = true;
            audio.play().then(() => {
                updateUI(true);
            }).catch(err => {
                console.log("Muted autoplay prevent response:", err);
                updateUI(false);
            });
        }

        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                updateUI(false);
            } else {
                playMusic();
            }
        }

        function seekAudio(val) {
            if (audio.duration) {
                audio.currentTime = (val / 100) * audio.duration;
            }
        }

        function restartTrack() {
            audio.currentTime = 0;
            if (!isPlaying) playMusic();
        }

        function toggleHeart(btn) {
            const icon = btn.querySelector('i');
            if (icon.classList.contains('far')) {
                icon.className = 'fas fa-heart text-[#BF7D83]';
            } else {
                icon.className = 'far fa-heart';
            }
        }

        function toggleShuffle(btn) {
            btn.classList.toggle('text-[#BF7D83]');
            btn.classList.toggle('opacity-100');
        }

        function toggleRepeat(btn) {
            btn.classList.toggle('text-[#BF7D83]');
            btn.classList.toggle('opacity-100');
        }

        audio.addEventListener('loadedmetadata', () => {
            if (totalTimeEl) totalTimeEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                if (progressBar) progressBar.value = pct;
                if (currentTimeEl) currentTimeEl.textContent = formatTime(audio.currentTime);
                if (totalTimeEl && totalTimeEl.textContent === '00:00') {
                    totalTimeEl.textContent = formatTime(audio.duration);
                }
            }
        });

        // El clic en el sobre cuenta como interacción real del usuario,
        // así que el navegador permite reproducir el audio con sonido de inmediato.
        function abrirInvitacion() {
            const pantalla = document.getElementById('pantalla-apertura');
            const sobre = document.getElementById('sobre');
            playMusic();
            if (sobre) sobre.classList.add('open');
            if (pantalla) {
                setTimeout(() => {
                    pantalla.style.transition = 'opacity 0.6s ease';
                    pantalla.style.opacity = '0';
                    setTimeout(() => {
                        pantalla.style.display = 'none';
                    }, 600);
                }, 500);
            }
        }

        document.getElementById('sobre')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                abrirInvitacion();
            }
        });

        // Genera brillos mágicos cayendo sobre la pantalla de apertura:
        // mezcla de estrellitas titilantes y partículas de luz suave (polvo de hada),
        // cada una con su propio vaivén y parpadeo para un efecto más orgánico.
        (function crearBrillos(){
            const capa = document.getElementById('sparkle-layer');
            if (!capa) return;
            const simbolos = ['✦', '✧', '✨', '✩', '❋'];
            const total = 34;
            for (let i = 0; i < total; i++) {
                const esEstrella = Math.random() > 0.4;
                const s = document.createElement(esEstrella ? 'span' : 'div');
                s.className = 'sparkle ' + (esEstrella ? 'star' : 'dust');

                if (esEstrella) {
                    s.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
                    const size = 8 + Math.random() * 18;
                    s.style.fontSize = size + 'px';
                } else {
                    const size = 3 + Math.random() * 6;
                    s.style.width = size + 'px';
                    s.style.height = size + 'px';
                }

                const left = Math.random() * 100;
                const driftDuration = 9 + Math.random() * 10;
                const twinkleDuration = 1.6 + Math.random() * 2.2;
                const delay = Math.random() * 14;

                s.style.left = left + '%';
                s.style.animationDuration = `${driftDuration}s, ${twinkleDuration}s`;
                s.style.animationDelay = `${delay}s, ${delay}s`;
                capa.appendChild(s);
            }
        })();

        function updateCountdown() {
            const eventDate = new Date('2026-08-29T16:00:00').getTime();
            const now = new Date().getTime();
            const diff = eventDate - now;

            if (diff <= 0) {
                const elDays = document.getElementById('cd-days');
                const elHours = document.getElementById('cd-hours');
                const elMinutes = document.getElementById('cd-minutes');
                const elSeconds = document.getElementById('cd-seconds');
                if (elDays) elDays.textContent = '00';
                if (elHours) elHours.textContent = '00';
                if (elMinutes) elMinutes.textContent = '00';
                if (elSeconds) elSeconds.textContent = '00';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            const elDays = document.getElementById('cd-days');
            const elHours = document.getElementById('cd-hours');
            const elMinutes = document.getElementById('cd-minutes');
            const elSeconds = document.getElementById('cd-seconds');

            if (elDays) elDays.textContent = String(days).padStart(2, '0');
            if (elHours) elHours.textContent = String(hours).padStart(2, '0');
            if (elMinutes) elMinutes.textContent = String(minutes).padStart(2, '0');
            if (elSeconds) elSeconds.textContent = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
