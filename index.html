    <script>
        function goToPage(pageNum) {
            const el = document.getElementById(`pagina-${pageNum}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth' });
            }
        }

        const audio = document.getElementById('bg-music');
        const playIcon = document.getElementById('play-icon');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        let isPlaying = false;

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updateUI(playing) {
            isPlaying = playing;
            if (playIcon) {
                if (playing) {
                    playIcon.className = 'fas fa-pause text-xl text-white';
                } else {
                    playIcon.className = 'fas fa-play text-xl text-white ml-0.5';
                }
            }
        }

        function playMusic() {
            audio.play().then(() => {
                updateUI(true);
            }).catch(err => {
                console.log("Autoplay prevent response:", err);
                updateUI(false);
            });
        }

        function playMusicMuted() {
            audio.muted = true;
            audio.play().then(() => {
                updateUI(true);
            }).catch(err => {
                console.log("Muted autoplay prevent response:", err);
                updateUI(false);
            });
        }

        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                updateUI(false);
            } else {
                playMusic();
            }
        }

        function seekAudio(val) {
            if (audio.duration) {
                audio.currentTime = (val / 100) * audio.duration;
            }
        }

        function restartTrack() {
            audio.currentTime = 0;
            if (!isPlaying) playMusic();
        }

        function toggleHeart(btn) {
            const icon = btn.querySelector('i');
            if (icon.classList.contains('far')) {
                icon.className = 'fas fa-heart text-[#BF7D83]';
            } else {
                icon.className = 'far fa-heart';
            }
        }

        function toggleShuffle(btn) {
            btn.classList.toggle('text-[#BF7D83]');
            btn.classList.toggle('opacity-100');
        }

        function toggleRepeat(btn) {
            btn.classList.toggle('text-[#BF7D83]');
            btn.classList.toggle('opacity-100');
        }

        audio.addEventListener('loadedmetadata', () => {
            if (totalTimeEl) totalTimeEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                if (progressBar) progressBar.value = pct;
                if (currentTimeEl) currentTimeEl.textContent = formatTime(audio.currentTime);
                if (totalTimeEl && totalTimeEl.textContent === '00:00') {
                    totalTimeEl.textContent = formatTime(audio.duration);
                }
            }
        });

        // El botón "Abrir invitación" cuenta como interacción real del usuario,
        // así que el navegador permite reproducir el audio con sonido de inmediato.
        function abrirInvitacion() {
            const pantalla = document.getElementById('pantalla-apertura');
            playMusic();
            if (pantalla) {
                pantalla.style.transition = 'opacity 0.6s ease';
                pantalla.style.opacity = '0';
                setTimeout(() => {
                    pantalla.style.display = 'none';
                }, 600);
            }
        }

        function updateCountdown() {
            const eventDate = new Date('2026-08-29T16:00:00').getTime();
            const now = new Date().getTime();
            const diff = eventDate - now;

            if (diff <= 0) {
                const elDays = document.getElementById('cd-days');
                const elHours = document.getElementById('cd-hours');
                const elMinutes = document.getElementById('cd-minutes');
                const elSeconds = document.getElementById('cd-seconds');
                if (elDays) elDays.textContent = '00';
                if (elHours) elHours.textContent = '00';
                if (elMinutes) elMinutes.textContent = '00';
                if (elSeconds) elSeconds.textContent = '00';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            const elDays = document.getElementById('cd-days');
            const elHours = document.getElementById('cd-hours');
            const elMinutes = document.getElementById('cd-minutes');
            const elSeconds = document.getElementById('cd-seconds');

            if (elDays) elDays.textContent = String(days).padStart(2, '0');
            if (elHours) elHours.textContent = String(hours).padStart(2, '0');
            if (elMinutes) elMinutes.textContent = String(minutes).padStart(2, '0');
            if (elSeconds) elSeconds.textContent = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
